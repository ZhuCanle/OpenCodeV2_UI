<!-- Plugin Logo (dark themes): same geometry, inverted colour so it stays visible on dark backgrounds. -->
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The "v2" is a hole in the mark, so it renders in the surrounding colour on any theme.
         Both glyphs are exactly 9.2 tall with flat top and bottom edges, so they line up. -->
    <mask id="v2" maskUnits="userSpaceOnUse" x="-2" y="-2" width="44" height="44">
      <rect x="-2" y="-2" width="44" height="44" fill="#FFFFFF"/>
      <g transform="translate(16.2 26.3)">
        <!-- "v": flat top cuts, slanted sides, truncated horizontal bottom -->
        <path d="M-0.4 0 H1.6 L3.6 5.5 L5.6 0 H7.6 L4.3 9.2 H2.9 Z" fill="#000000"/>
        <!-- "2": 7-segment digital style. The path starts and ends on the cell edges
             (x 8.5 / 15.7) so the top, middle and bottom bars all begin and end
             at the same x, and the top/bottom edges line up with the "v". -->
        <path d="M8.5 0.95 H14.75 V4.6 H9.45 V8.25 H15.7" fill="none" stroke="#000000" stroke-width="1.9"
              stroke-linecap="butt" stroke-linejoin="miter"/>
      </g>
    </mask>
  </defs>
  <!-- opencode mark: 28.8x36, filling the 36x36 safe area -->
  <g mask="url(#v2)">
    <g transform="translate(5.6 -5.2) scale(1.2)" fill="#FFFFFF">
      <path d="M18 30H6V18H18V30Z"/>
      <path d="M18 12H6V30H18V12ZM24 36H0V6H24V36Z"/>
    </g>
  </g>
</svg>
