# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# The Kotlin Standard Library is already provided by the IntelliJ Platform. Bundling it again can
# cause version conflicts / ClassNotFoundException at runtime; verifyPluginProjectConfiguration
# reports it as a configuration issue, and the Marketplace approval guidelines require a clean
# Plugin Verifier run for every upload.
kotlin.stdlib.default.dependency=false
